name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bot:
    name: Bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Tiplarni tekshirish
        run: npm run typecheck
      - name: Build
        run: npm run build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Tiplarni tekshirish
        run: npm run typecheck
